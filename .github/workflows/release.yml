name: Release

on:
  push:
    tags:
      - 'ext*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., ext4)'
        required: true

# Workflow-level minimum: read-only. The `release` job overrides to
# `contents: write` for `gh release create`. The reusable build jobs
# inherit `contents: read`, which is what `_extension_distribution.yml`
# actually needs (verified empirically — ci.yml runs the same reusable
# workflow under `contents: read` without issue).
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# bebb406d = lastrk/extension-ci-tools fix-epel8 tip at 2026-05-13. Single
# commit on top of duckdb/extension-ci-tools v1.5.1 that disables EPEL 8 in
# the manylinux_2_28 Dockerfiles. Pinned to the SHA (not the branch name) so
# a force-push on the personal fork can't silently change what gets built
# and shipped when an `ext*` tag is pushed. Tracked upstream as
# duckdb/extension-ci-tools#374 / PR #375 — when that lands and gets
# backported to v1.5.x, swap the eight pins below back to v1.5.1 (or whatever
# the closest tag is at the time) and drop override_ci_tools_repository.

jobs:
  build-v1_4_4:
    name: Build (DuckDB v1.4.4)
    uses: lastrk/extension-ci-tools/.github/workflows/_extension_distribution.yml@bebb406d50413c4f4a55a44d9316a69b9d1a0018
    with:
      duckdb_version: v1.4.4
      ci_tools_version: bebb406d50413c4f4a55a44d9316a69b9d1a0018
      override_ci_tools_repository: lastrk/extension-ci-tools
      extension_name: thdck_spark_funcs
      exclude_archs: 'linux_amd64_musl;windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads'

  build-v1_5_0:
    name: Build (DuckDB v1.5.0)
    uses: lastrk/extension-ci-tools/.github/workflows/_extension_distribution.yml@bebb406d50413c4f4a55a44d9316a69b9d1a0018
    with:
      duckdb_version: v1.5.0
      ci_tools_version: bebb406d50413c4f4a55a44d9316a69b9d1a0018
      override_ci_tools_repository: lastrk/extension-ci-tools
      extension_name: thdck_spark_funcs
      exclude_archs: 'linux_amd64_musl;windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads'

  build-v1_5_1:
    name: Build (DuckDB v1.5.1)
    uses: lastrk/extension-ci-tools/.github/workflows/_extension_distribution.yml@bebb406d50413c4f4a55a44d9316a69b9d1a0018
    with:
      duckdb_version: v1.5.1
      ci_tools_version: bebb406d50413c4f4a55a44d9316a69b9d1a0018
      override_ci_tools_repository: lastrk/extension-ci-tools
      extension_name: thdck_spark_funcs
      exclude_archs: 'linux_amd64_musl;windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads'

  build-v1_5_2:
    name: Build (DuckDB v1.5.2)
    uses: lastrk/extension-ci-tools/.github/workflows/_extension_distribution.yml@bebb406d50413c4f4a55a44d9316a69b9d1a0018
    with:
      duckdb_version: v1.5.2
      ci_tools_version: bebb406d50413c4f4a55a44d9316a69b9d1a0018
      override_ci_tools_repository: lastrk/extension-ci-tools
      extension_name: thdck_spark_funcs
      exclude_archs: 'linux_amd64_musl;windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads'

  release:
    name: Create GitHub Release
    needs: [build-v1_4_4, build-v1_5_0, build-v1_5_1, build-v1_5_2]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          for dir in artifacts/thdck_spark_funcs-*; do
            basename=$(basename "$dir")
            version=$(echo "$basename" | sed 's/thdck_spark_funcs-\(v[0-9.]*\)-extension-.*/\1/')
            arch=$(echo "$basename" | sed 's/thdck_spark_funcs-v[0-9.]*-extension-//')
            cp "$dir"/thdck_spark_funcs.duckdb_extension \
               "release-assets/thdck_spark_funcs-${version}-${arch}.duckdb_extension"
          done
          ls -la release-assets/

      - name: Determine tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          gh release create "$TAG" release-assets/* \
            --title "$TAG" \
            --notes "Extension binaries for DuckDB v1.4.4, v1.5.0, v1.5.1, and v1.5.2

          Platforms: linux_amd64, linux_arm64, osx_amd64, osx_arm64

          ## Usage
          \`\`\`bash
          # Download all binaries for a specific DuckDB version and platform
          gh release download ${TAG} --pattern '*v1.5.2*osx_arm64*' --repo lastrk/thunderduck-duckdb-extension

          # Download all binaries for a DuckDB version
          gh release download ${TAG} --pattern '*v1.5.2*' --repo lastrk/thunderduck-duckdb-extension
          \`\`\`"
